<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>调用记录 · Target Ops</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/dashboard/app.css">
  <script src="/dashboard/diff.js" defer></script>
  <script src="/dashboard/detail.js" defer></script>
  <script src="/dashboard/app.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brandmark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 7 5 5-5 5m8 0h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="brandname">Target Ops</div>
    </div>
    <nav class="nav">
      <a href="#overview" class="nav-link active" data-nav="overview"><span class="nav-icon">◫</span> 总览</a>
      <a href="#calls" class="nav-link" data-nav="calls"><span class="nav-icon">≡</span> 调用记录</a>
      <a href="#sessions" class="nav-link" data-nav="sessions"><span class="nav-icon">◎</span> 客户端 <span id="sideSessionCount" class="nav-count">0</span></a>
    </nav>
    <div class="sidebar-head">
      <span>客户端</span>
      <button class="icon-btn" id="clearSession" title="清除客户端筛选" aria-label="清除客户端筛选" hidden>×</button>
    </div>
    <div id="sessionList" class="sidebar-sessions"><p class="muted small">读取中…</p></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="breadcrumb">调用记录</div>
      <div class="top-actions">
        <label class="auto-switch"><input type="checkbox" id="autoRefresh" checked><span class="switch"></span> 自动刷新</label>
        <button id="refresh" class="icon-button" title="刷新数据" aria-label="刷新数据">↻</button>
        <form method="post" action="/dashboard/logout" class="logout-form"><button type="submit" class="logout-button">退出</button></form>
      </div>
    </div>

    <div class="content" id="overview">
      <header class="page-header">
        <div>
          <h1>活动概览</h1>
        </div>
        <div class="window-control">
          <span>统计范围</span>
          <select id="hours">
            <option value="1">最近 1 小时</option>
            <option value="24" selected>最近 24 小时</option>
            <option value="168">最近 7 天</option>
            <option value="720">最近 30 天</option>
          </select>
        </div>
      </header>

      <div id="errorBar" class="error-bar" hidden></div>

      <section class="metrics">
        <div class="metric"><div class="metric-label">调用次数</div><div class="metric-number" id="metricCalls">—</div></div>
                <div class="metric"><div class="metric-label">客户端</div><div class="metric-number" id="metricClients">—</div></div>
        <div class="metric"><div class="metric-label">失败率</div><div class="metric-number" id="metricError">—</div><div class="metric-description" id="errorDetail">— 次失败</div></div>
        <div class="metric"><div class="metric-label">P95 耗时</div><div class="metric-number" id="metricLatency">—</div><div class="metric-description" id="avgDetail">平均 —</div></div>
      </section>

      <section class="panel calls-panel" id="calls">
        <div class="panel-head"><h2>最近调用</h2></div>
        <div class="filters">
          <label class="search-wrapper"><span>⌕</span><input id="search" placeholder="搜索命令、文件、工具或客户端" autocomplete="off" aria-label="搜索命令、工具、目标或客户端"></label>
          <select id="clientFilter" aria-label="筛选客户端"><option value="">全部客户端</option></select>
          <select id="toolFilter" aria-label="筛选工具"><option value="">全部工具</option></select>
          <select id="statusFilter" aria-label="筛选状态"><option value="">全部状态</option><option value="ok">成功</option><option value="error">失败</option></select>
          <button id="resetFilters" class="text-button">清除筛选</button>
        </div>
        <div id="activeFilters" class="active-filters" hidden></div>
        <div class="table-container">
          <table>
            <thead><tr><th>时间</th><th>客户端</th><th>工具</th><th>操作</th><th>目标</th><th>耗时</th><th>状态</th><th></th></tr></thead>
            <tbody id="callsTable"><tr><td colspan="8" class="empty-cell">读取中…</td></tr></tbody>
          </table>
        </div>
        <div class="table-foot">
          <div id="listCount">—</div>
          <button id="loadMore" class="secondary-button" hidden>加载更多</button>
        </div>
      </section>

      <section class="charts">
        <div class="panel chart-main">
          <div class="panel-head"><h2>请求趋势</h2><span class="panel-caption" id="chartWindow">最近 24 小时</span></div>
          <div class="activity-chart" id="trendChart" aria-label="MCP 请求趋势"></div>
          <div class="chart-axis"><span id="chartStart">—</span><span id="chartEnd">—</span></div>
          <div class="chart-legend"><span><i class="dot dot-blue"></i> 全部请求</span><span><i class="dot dot-orange"></i> 失败</span></div>
        </div>
        <div class="panel chart-side">
          <div class="panel-head"><h2>常用工具</h2></div>
          <div id="toolsChart" class="tools-chart"><div class="muted">读取中…</div></div>
        </div>
      </section>

      <section class="panel session-panel" id="sessions">
        <div class="panel-head"><h2>客户端</h2></div>
        <div id="sessionGrid" class="session-grid"><div class="muted">读取中…</div></div>
      </section>


    </div>
  </main>
</div>
<div id="drawerOverlay" class="drawer-overlay" hidden></div>
<aside id="detailDrawer" class="detail-drawer" aria-label="调用详情" aria-hidden="true">
  <div class="drawer-heading"><div class="drawer-heading-text"><h2 id="drawerTitle">调用详情</h2><div id="drawerMeta" class="drawer-meta"></div></div><button id="closeDrawer" class="icon-button" aria-label="关闭详情">×</button></div>
  <div id="drawerContent" class="drawer-content"></div>
</aside>
</body>
</html>
