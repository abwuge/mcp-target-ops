<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  color-scheme: light dark;
  font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --border: color-mix(in srgb, currentColor 16%, transparent);
  --muted: color-mix(in srgb, currentColor 58%, transparent);
  --accent-bg: color-mix(in srgb, #58a6ff 12%, transparent);
  --ok-bg: color-mix(in srgb, #2ea043 14%, transparent);
  --error-bg: color-mix(in srgb, #f85149 15%, transparent);
  --success: #1a7f37;
  --error: #cf222e;
}
@media (prefers-color-scheme: dark) { :root { --success: #3fb950; --error: #ff7b72; } }
* { box-sizing: border-box; }
body { margin: 0; padding: 10px; background: transparent; color: inherit; }
.card { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.card > summary { list-style: none; cursor: pointer; user-select: none; }
.card > summary::-webkit-details-marker { display: none; }
.head { display: flex; gap: 10px; padding: 10px 12px; align-items: center; border-bottom: 1px solid var(--border); }
.card:not([open]) .head { border-bottom: 0; }
.file { min-width: 0; flex: 1; }
.title { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.path { margin-top: 2px; font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; opacity: .58; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kind, .status, .chip { flex: 0 0 auto; border: 1px solid var(--border); border-radius: 999px; padding: 2px 7px; font-size: 11px; }
.kind { background: var(--accent-bg); }
.status { color: var(--muted); }
.status.ok, .chip.active, .chip.enabled { background: var(--ok-bg); color: var(--success); }
.status.error, .chip.disabled { background: var(--error-bg); color: var(--error); }
.viewer { max-height: 480px; overflow: auto; background: color-mix(in srgb, currentColor 2%, transparent); }
.row { min-width: 0; padding: 9px 12px; }
.row + .row { border-top: 1px solid var(--border); }
.topline { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.name { min-width: 0; margin-right: auto; font-weight: 650; overflow-wrap: anywhere; }
.chip { padding: 1px 6px; color: var(--muted); font-size: 10px; }
.chip.type { background: var(--accent-bg); }
.meta { margin-top: 5px; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
.notice { padding: 14px 12px; color: var(--muted); }
</style>
</head>
<body>
<details class="card" id="card" open>
  <summary class="head">
    <div class="file"><div class="title" id="title">Inventory</div><div class="path" id="subtitle"></div></div>
    <div class="kind" id="kind">Inventory</div>
    <div class="status" id="count">0 items</div>
  </summary>
  <div class="viewer" id="list"><div class="notice" id="empty">Waiting for results…</div></div>
</details>
<script>
(() => {
  const card = document.getElementById('card');
  const title = document.getElementById('title');
  const subtitle = document.getElementById('subtitle');
  const kind = document.getElementById('kind');
  const count = document.getElementById('count');
  const list = document.getElementById('list');

  function element(tag, className, text) { const node = document.createElement(tag); if (className) node.className = className; if (text !== undefined) node.textContent = String(text); return node; }
  function chip(text, className = '') { return element('span', `chip ${className}`.trim(), text); }
  function formatBytes(bytes) { const value = Number(bytes); if (!Number.isFinite(value) || value < 0) return 'unknown size'; if (value < 1024) return `${value} B`; if (value < 1048576) return `${Math.round(value / 102.4) / 10} KiB`; return `${Math.round(value / 104857.6) / 10} MiB`; }
  function formatTimeout(ms) { const value = Number(ms); if (!Number.isFinite(value) || value < 0) return 'unknown timeout'; if (value % 1000 === 0) return `${value / 1000}s timeout`; return `${value}ms timeout`; }
  function setCount(value, enabled = true) { count.textContent = `${value} item${value === 1 ? '' : 's'}`; count.className = `status ${enabled ? 'ok' : 'error'}`; }
  function clearList() { list.replaceChildren(); }

  function renderTargets(targets) {
    title.textContent = 'Targets';
    subtitle.textContent = '';
    kind.textContent = 'Inventory';
    setCount(targets.length, targets.some(item => item.enabled !== false));
    clearList();
    if (!targets.length) { list.appendChild(element('div', 'notice', 'No targets configured.')); return; }
    for (const item of targets) {
      const row = element('div', 'row'); const top = element('div', 'topline');
      top.appendChild(element('div', 'name', item.id || item.config_key || 'unnamed target'));
      top.appendChild(chip(item.kind || 'target', 'type'));
      if (item.active) top.appendChild(chip('active', 'active'));
      top.appendChild(chip(item.enabled === false ? 'disabled' : 'enabled', item.enabled === false ? 'disabled' : 'enabled'));
      row.appendChild(top);
      const policy = item.policy && typeof item.policy === 'object' ? item.policy : {}; const capabilities = [];
      if (policy.allow_exec) capabilities.push('exec'); if (policy.allow_terminal) capabilities.push('terminal'); if (policy.allow_file_read) capabilities.push('read'); if (policy.allow_file_write) capabilities.push('write'); if (policy.allow_select_active) capabilities.push('select');
      const roots = Array.isArray(policy.allowed_roots) ? policy.allowed_roots : []; const parts = [capabilities.length ? capabilities.join(' · ') : 'no allowed operations'];
      if (roots.length) parts.push(`roots: ${roots.join(', ')}`); if (policy.require_explicit_target_for_write) parts.push('explicit target required for writes');
      row.appendChild(element('div', 'meta', parts.join('  ·  '))); list.appendChild(row);
    }
  }

  function renderServers(servers) {
    title.textContent = 'MCP servers';
    subtitle.textContent = '';
    kind.textContent = 'Inventory';
    setCount(servers.length, servers.some(item => item.enabled !== false));
    clearList();
    if (!servers.length) { list.appendChild(element('div', 'notice', 'No downstream MCP servers configured.')); return; }
    for (const item of servers) {
      const row = element('div', 'row'); const top = element('div', 'topline');
      top.appendChild(element('div', 'name', item.name || 'unnamed server'));
      top.appendChild(chip(item.config_source || 'configured', 'type'));
      top.appendChild(chip(item.enabled === false ? 'disabled' : 'enabled', item.enabled === false ? 'disabled' : 'enabled')); row.appendChild(top);
      const parts = [formatTimeout(item.timeout_ms), `max ${formatBytes(item.max_response_bytes)}`];
      if (item.secret_target) parts.push(`secret target: ${item.secret_target}`);
      const staticHeaders = Array.isArray(item.static_header_names) ? item.static_header_names.length : 0; const secretHeaders = Array.isArray(item.secret_header_names) ? item.secret_header_names.length : 0;
      if (staticHeaders || secretHeaders) parts.push(`headers: ${staticHeaders} static, ${secretHeaders} secret`);
      row.appendChild(element('div', 'meta', parts.join('  ·  '))); list.appendChild(row);
    }
  }

  let collapseTimer = null; let sleepTimer = null; let sleeping = false;
  function scheduleLifecycle() {
    if (collapseTimer) clearTimeout(collapseTimer); if (sleepTimer) clearTimeout(sleepTimer);
    sleeping = false; card.open = true;
    collapseTimer = setTimeout(() => { card.open = false; }, 3000);
    sleepTimer = setTimeout(() => { card.open = false; list.replaceChildren(); sleeping = true; }, 30000);
  }
  function render(raw) {
    const data = raw && typeof raw === 'object' ? raw : {};
    if (typeof data.result_id === 'string') resultId = data.result_id;
    if (Array.isArray(data.targets)) renderTargets(data.targets);
    else if (Array.isArray(data.servers)) renderServers(data.servers);
    else { title.textContent = 'Inventory'; subtitle.textContent = ''; kind.textContent = 'Inventory'; count.textContent = '0 items'; count.className = 'status'; clearList(); list.appendChild(element('div', 'notice', 'No inventory data available.')); }
    scheduleLifecycle();
  }

  let rpcId = 0; const pendingRequests = new Map(); let resultId = null;
  const rpcRequest = (method, params) => new Promise((resolve, reject) => { const id = ++rpcId; pendingRequests.set(id, {resolve,reject}); window.parent.postMessage({jsonrpc:'2.0',id,method,params}, '*'); });
  const toolResultData = result => result?.structuredContent || result?.content?.find?.(item => item?.type === 'json')?.json || result?.content || result || {};
  async function restoreSleepingCard() {
    if (!sleeping || !resultId) return;
    sleeping = false; list.innerHTML = '<div class="notice">Loading result…</div>';
    try { const cached = toolResultData(await rpcRequest('tools/call', { name: 'result_read', arguments: { result_id: resultId } })); if (cached?.found && cached?.data) render(cached.data); else list.innerHTML = '<div class="notice">Result expired.</div>'; }
    catch (_) { list.innerHTML = '<div class="notice">Result unavailable.</div>'; }
  }
  card.addEventListener('toggle', () => { if (card.open && sleeping) restoreSleepingCard(); });
  window.addEventListener('message', event => { const msg = event.data; if (msg?.jsonrpc === '2.0' && msg.id !== undefined && pendingRequests.has(msg.id)) { const pending = pendingRequests.get(msg.id); pendingRequests.delete(msg.id); if (msg.error) pending.reject(msg.error); else pending.resolve(msg.result); return; } if (msg?.method === 'ui/notifications/tool-result') render(msg.params?.structuredContent || msg.params?.content || msg.params); });
  async function initializeBridge() { await rpcRequest('ui/initialize', { appInfo: { name: 'target-ops-inventory', version: '1.2.0' }, appCapabilities: { tools: {} }, protocolVersion: '2026-01-26' }); window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}}, '*'); if (window.openai?.toolOutput) render(window.openai.toolOutput); else if (window.openai?.toolResponseMetadata?.structuredContent) render(window.openai.toolResponseMetadata.structuredContent); }
  initializeBridge().catch(error => console.error('Failed to initialize MCP Apps bridge:', error));
})();
</script>
</body>
</html>
