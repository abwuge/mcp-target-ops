<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  color-scheme: light dark;
  font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --border: color-mix(in srgb, currentColor 16%, transparent);
  --muted: color-mix(in srgb, currentColor 58%, transparent);
  --read-bg: color-mix(in srgb, #58a6ff 12%, transparent);
  --ok-bg: color-mix(in srgb, #2ea043 14%, transparent);
  --error-bg: color-mix(in srgb, #f85149 15%, transparent);
  --error: #cf222e;
}
@media (prefers-color-scheme: dark) { :root { --error: #ff7b72; } }
* { box-sizing: border-box; }
body { margin: 0; padding: 10px; background: transparent; color: inherit; }
.card { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.head { display: flex; gap: 10px; padding: 10px 12px; align-items: center; border-bottom: 1px solid var(--border); }
.file { min-width: 0; flex: 1; }
.title { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.path { margin-top: 2px; font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; opacity: .58; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kind, .status { flex: 0 0 auto; border: 1px solid var(--border); border-radius: 999px; padding: 2px 7px; font-size: 11px; }
.kind { background: var(--read-bg); }
.status.ok { background: var(--ok-bg); }
.status.error { background: var(--error-bg); color: var(--error); }
.viewer { max-height: 480px; overflow: auto; background: color-mix(in srgb, currentColor 2%, transparent); }
.file-block + .file-block { border-top: 1px solid var(--border); }
.file-block > summary { cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: center; padding: 7px 10px; font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; user-select: none; }
.file-block > summary::-webkit-details-marker { display: none; }
.file-block > summary::before { content: '›'; width: 10px; color: var(--muted); transition: transform .12s ease; }
.file-block[open] > summary::before { transform: rotate(90deg); }
.file-name { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-state { flex: 0 0 auto; color: var(--muted); }
.file-state.error { color: var(--error); }
.file-body { border-top: 1px solid color-mix(in srgb, currentColor 8%, transparent); }
.code-line { display: grid; grid-template-columns: 52px minmax(max-content, 1fr); min-height: 20px; font: 12px/20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.gutter { padding: 0 7px; text-align: right; user-select: none; color: var(--muted); border-right: 1px solid color-mix(in srgb, currentColor 8%, transparent); }
.code { padding: 0 10px; white-space: pre; }
.notice { padding: 14px 12px; color: var(--muted); }
.notice.error { color: var(--error); background: var(--error-bg); }
.details { border-top: 1px solid var(--border); }
.details summary { cursor: pointer; padding: 8px 12px; font-size: 12px; user-select: none; color: var(--muted); }
.meta { padding: 0 12px 10px; display: grid; gap: 4px; }
.meta-row { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 8px; }
.meta-label { color: var(--muted); }
.meta-value { font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="file"><div class="title" id="title">File read</div><div class="path" id="path"></div></div>
    <div class="kind" id="kind">Read</div>
    <div class="status" id="status">waiting</div>
  </div>
  <div class="viewer" id="viewer"><div class="notice">Waiting for file content…</div></div>
  <details class="details" id="details"><summary>Details</summary><div class="meta" id="meta"></div></details>
</div>
<script>
(() => {
  const title = document.getElementById('title');
  const pathEl = document.getElementById('path');
  const kindEl = document.getElementById('kind');
  const statusEl = document.getElementById('status');
  const viewer = document.getElementById('viewer');
  const meta = document.getElementById('meta');
  const details = document.getElementById('details');

  const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const baseName = path => String(path || '').split('/').filter(Boolean).pop() || 'File read';
  const metaRow = (label, value) => value === undefined || value === null || value === '' ? '' : `<div class="meta-row"><div class="meta-label">${esc(label)}</div><div class="meta-value">${esc(value)}</div></div>`;

  function lineRows(content, startLine, encoding) {
    if (encoding === 'base64') return `<div class="notice">Binary content shown as base64.</div><div class="code-line"><span class="gutter"></span><span class="code">${esc(content || '')}</span></div>`;
    const lines = String(content ?? '').split('\n');
    if (lines.length && lines[lines.length - 1] === '') lines.pop();
    const first = Number.isInteger(startLine) ? startLine : 1;
    if (!lines.length) return '<div class="notice">File or selected range is empty.</div>';
    return lines.map((line, index) => `<div class="code-line"><span class="gutter">${first + index}</span><span class="code">${esc(line)}</span></div>`).join('');
  }

  function rangeText(item) {
    if (!Number.isInteger(item?.start_line)) return '';
    if (!Number.isInteger(item?.end_line) || item.end_line < item.start_line) return `line ${item.start_line}`;
    return item.start_line === item.end_line ? `line ${item.start_line}` : `lines ${item.start_line}–${item.end_line}`;
  }

  function renderSingle(data) {
    const path = data.path || '';
    title.textContent = baseName(path);
    pathEl.textContent = path;
    kindEl.textContent = rangeText(data) || 'Read';
    statusEl.textContent = data.truncated ? 'Truncated' : 'Read';
    statusEl.className = 'status ok';
    viewer.innerHTML = lineRows(data.content, data.start_line, data.encoding);
    meta.innerHTML =
      metaRow('target', data.resolved_target?.target) +
      metaRow('path', path) +
      metaRow('range', rangeText(data)) +
      metaRow('bytes', data.bytes) +
      metaRow('encoding', data.encoding) +
      metaRow('sha256', data.sha256) +
      metaRow('truncated', data.truncated ? 'yes' : 'no');
    details.hidden = !meta.innerHTML;
  }

  function batchBlock(item, index) {
    const block = document.createElement('details');
    block.className = 'file-block';
    block.open = item.success === false || index === 0;
    const summary = document.createElement('summary');
    const name = document.createElement('span');
    name.className = 'file-name';
    name.textContent = item.path || `item ${index + 1}`;
    const state = document.createElement('span');
    state.className = `file-state${item.success === false ? ' error' : ''}`;
    state.textContent = item.success === false ? 'failed' : ([rangeText(item), item.truncated ? 'truncated' : ''].filter(Boolean).join(' · ') || 'read');
    summary.append(name, state);
    block.appendChild(summary);

    const body = document.createElement('div');
    body.className = 'file-body';
    if (item.success === false) {
      body.innerHTML = `<div class="notice error">${esc(item.error || 'File read failed.')}</div>`;
    } else {
      body.innerHTML = lineRows(item.content, item.start_line, item.encoding);
    }
    block.appendChild(body);
    return block;
  }

  function renderBatch(data) {
    const files = Array.isArray(data.files) ? data.files : [];
    const failed = Number.isInteger(data.failed) ? data.failed : files.filter(file => file.success === false).length;
    const succeeded = Number.isInteger(data.succeeded) ? data.succeeded : files.length - failed;
    title.textContent = `${files.length} file reads`;
    pathEl.textContent = files.map(file => file.path).filter(Boolean).join(' · ');
    kindEl.textContent = 'Batch read';
    statusEl.textContent = failed ? `${succeeded} read · ${failed} failed` : `${succeeded} read`;
    statusEl.className = `status ${failed ? 'error' : 'ok'}`;
    viewer.replaceChildren();
    if (!files.length) viewer.innerHTML = '<div class="notice">No file results returned.</div>';
    else files.forEach((item, index) => viewer.appendChild(batchBlock(item, index)));
    meta.innerHTML =
      metaRow('target', data.resolved_target?.target) +
      metaRow('requested', data.requested_count) +
      metaRow('succeeded', succeeded) +
      metaRow('failed', failed) +
      metaRow('truncated', data.truncated ? 'yes' : 'no');
    details.hidden = !meta.innerHTML;
  }

  function render(raw) {
    const data = raw && typeof raw === 'object' ? raw : {};
    if (Array.isArray(data.files) && Number.isInteger(data.requested_count)) renderBatch(data);
    else renderSingle(data);
  }

  let rpcId = 0;
  const pendingRequests = new Map();
  const rpcRequest = (method, params) => new Promise((resolve, reject) => {
    const id = ++rpcId;
    pendingRequests.set(id, { resolve, reject });
    window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
  });

  window.addEventListener('message', event => {
    const msg = event.data;
    if (msg?.jsonrpc === '2.0' && msg.id !== undefined && pendingRequests.has(msg.id)) {
      const pending = pendingRequests.get(msg.id);
      pendingRequests.delete(msg.id);
      if (msg.error) pending.reject(msg.error);
      else pending.resolve(msg.result);
      return;
    }
    if (msg?.method === 'ui/notifications/tool-result') {
      render(msg.params?.structuredContent || msg.params?.content || msg.params);
    }
  });

  async function initializeBridge() {
    await rpcRequest('ui/initialize', {
      appInfo: { name: 'target-ops-file-read', version: '1.0.0' },
      appCapabilities: {},
      protocolVersion: '2026-01-26',
    });
    window.parent.postMessage({ jsonrpc: '2.0', method: 'ui/notifications/initialized', params: {} }, '*');
  }

  if (window.openai?.toolOutput) render(window.openai.toolOutput);
  else if (window.openai?.toolResponseMetadata?.structuredContent) render(window.openai.toolResponseMetadata.structuredContent);
  initializeBridge().catch(error => console.error('Failed to initialize MCP Apps bridge:', error));
})();
</script>
</body>
</html>
