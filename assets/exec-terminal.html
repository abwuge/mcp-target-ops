<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  color-scheme: light dark;
  font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --border: color-mix(in srgb, currentColor 16%, transparent);
  --muted: color-mix(in srgb, currentColor 58%, transparent);
  --accent-bg: color-mix(in srgb, #58a6ff 12%, transparent);
  --ok-bg: color-mix(in srgb, #2ea043 14%, transparent);
  --error-bg: color-mix(in srgb, #f85149 15%, transparent);
  --warn-bg: color-mix(in srgb, #d29922 15%, transparent);
  --success: #1a7f37;
  --error: #cf222e;
  --warning: #9a6700;
  --ansi-black: #24292f; --ansi-red: #cf222e; --ansi-green: #1a7f37; --ansi-yellow: #9a6700;
  --ansi-blue: #0969da; --ansi-magenta: #8250df; --ansi-cyan: #1b7c83; --ansi-white: #d0d7de;
  --ansi-bright-black: #57606a; --ansi-bright-red: #a40e26; --ansi-bright-green: #2da44e; --ansi-bright-yellow: #bf8700;
  --ansi-bright-blue: #218bff; --ansi-bright-magenta: #a475f9; --ansi-bright-cyan: #3192aa; --ansi-bright-white: #f6f8fa;
}
@media (prefers-color-scheme: dark) {
  :root {
    --success: #3fb950; --error: #ff7b72; --warning: #d29922;
    --ansi-black: #484f58; --ansi-red: #ff7b72; --ansi-green: #3fb950; --ansi-yellow: #d29922;
    --ansi-blue: #58a6ff; --ansi-magenta: #bc8cff; --ansi-cyan: #39c5cf; --ansi-white: #b1bac4;
    --ansi-bright-black: #6e7681; --ansi-bright-red: #ffa198; --ansi-bright-green: #56d364; --ansi-bright-yellow: #e3b341;
    --ansi-bright-blue: #79c0ff; --ansi-bright-magenta: #d2a8ff; --ansi-bright-cyan: #56d4dd; --ansi-bright-white: #f0f6fc;
  }
}
* { box-sizing: border-box; }
body { margin: 0; padding: 10px; background: transparent; color: inherit; }
.card { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.card > summary { list-style: none; cursor: pointer; user-select: none; }
.card > summary::-webkit-details-marker { display: none; }
.head { display: flex; gap: 10px; padding: 10px 12px; align-items: center; border-bottom: 1px solid var(--border); }
.card:not([open]) .head { border-bottom: 0; }
.file { min-width: 0; flex: 1; }
.title { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.path { margin-top: 2px; font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; opacity: .58; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kind, .status { flex: 0 0 auto; border: 1px solid var(--border); border-radius: 999px; padding: 2px 7px; font-size: 11px; }
.kind { background: var(--accent-bg); }
.status.ok { background: var(--ok-bg); color: var(--success); }
.status.error { background: var(--error-bg); color: var(--error); }
.status.warn { background: var(--warn-bg); color: var(--warning); }
.viewer { max-height: 480px; overflow: auto; background: color-mix(in srgb, currentColor 2%, transparent); }
.block + .block, .batch-item + .batch-item { border-top: 1px solid var(--border); }
.block-label { padding: 6px 10px; border-bottom: 1px solid color-mix(in srgb, currentColor 8%, transparent); color: var(--muted); font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.command { margin: 0; padding: 8px 10px; font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
.batch-item > summary { cursor: pointer; list-style: none; user-select: none; }
.batch-item > summary::-webkit-details-marker { display: none; }
.batch-item > summary::before { content: '›'; display: inline-block; width: 12px; color: var(--muted); transition: transform .12s ease; }
.batch-item[open] > summary::before { transform: rotate(90deg); }
.output { margin: 0; padding: 0 10px 9px 22px; font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
.stderr .block-label { color: var(--error); }
.notice { overflow-wrap: anywhere; padding: 14px 12px; color: var(--muted); }
.notice.error { color: var(--error); background: var(--error-bg); }
.notice.warn { color: var(--warning); background: var(--warn-bg); }
.batch-item > summary { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 7px 10px; font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.batch-item > summary::before { grid-column: 1; width: 12px; }
.batch-command { grid-column: 2; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.batch-state { grid-column: 3; color: var(--muted); white-space: nowrap; }
.batch-state.error { color: var(--error); }
.batch-state.warn { color: var(--warning); }
.batch-body { border-top: 1px solid color-mix(in srgb, currentColor 8%, transparent); }
.cwd { padding: 0 10px 8px; color: var(--muted); font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow-wrap: anywhere; }
.item-note { padding: 0 10px 8px; color: var(--warning); font-size: 11px; }
.details { border-top: 1px solid var(--border); }
.details summary { cursor: pointer; padding: 8px 12px; font-size: 12px; user-select: none; color: var(--muted); }
.meta { padding: 0 12px 10px; display: grid; gap: 4px; }
.meta-row { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 8px; }
.meta-label { color: var(--muted); }
.meta-value { font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow-wrap: anywhere; }
</style>
</head>
<body>
<details class="card" id="execution">
  <summary class="head">
    <div class="file"><div class="title" id="title">Command result</div><div class="path" id="path"></div></div>
    <div class="kind" id="kind">Exec</div>
    <div class="status" id="status">waiting</div>
  </summary>
  <div class="viewer" id="viewer"><div class="notice">Waiting for command output…</div></div>
  <details class="details" id="details"><summary>Details</summary><div class="meta" id="meta"></div></details>
</details>
<script>
(() => {
  const execution = document.getElementById('execution');
  const title = document.getElementById('title');
  const pathEl = document.getElementById('path');
  const kindEl = document.getElementById('kind');
  const statusEl = document.getElementById('status');
  const viewer = document.getElementById('viewer');
  const meta = document.getElementById('meta');
  const details = document.getElementById('details');

  const normalColors = ['var(--ansi-black)','var(--ansi-red)','var(--ansi-green)','var(--ansi-yellow)','var(--ansi-blue)','var(--ansi-magenta)','var(--ansi-cyan)','var(--ansi-white)'];
  const brightColors = ['var(--ansi-bright-black)','var(--ansi-bright-red)','var(--ansi-bright-green)','var(--ansi-bright-yellow)','var(--ansi-bright-blue)','var(--ansi-bright-magenta)','var(--ansi-bright-cyan)','var(--ansi-bright-white)'];
  const metaRow = (label, value) => value === undefined || value === null || value === '' ? '' : `<div class="meta-row"><div class="meta-label">${escapeHtml(label)}</div><div class="meta-value">${escapeHtml(value)}</div></div>`;

  function escapeHtml(value) { return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
  function element(tag, className, text) { const node = document.createElement(tag); if (className) node.className = className; if (text !== undefined) node.textContent = text; return node; }
  function freshAnsiState() { return { bold:false, dim:false, italic:false, underline:false, inverse:false, fg:null, bg:null }; }
  function xtermColor(index) {
    if (!Number.isInteger(index) || index < 0 || index > 255) return null;
    if (index < 8) return normalColors[index];
    if (index < 16) return brightColors[index - 8];
    if (index >= 232) { const level = 8 + (index - 232) * 10; return `rgb(${level} ${level} ${level})`; }
    const n = index - 16; const component = value => value === 0 ? 0 : 55 + value * 40;
    return `rgb(${component(Math.floor(n / 36))} ${component(Math.floor((n % 36) / 6))} ${component(n % 6)})`;
  }
  function applySgr(state, rawCodes) {
    const codes = rawCodes === '' ? [0] : rawCodes.split(';').map(value => Number(value || 0));
    for (let i = 0; i < codes.length; i += 1) {
      const code = codes[i];
      if (code === 0) Object.assign(state, freshAnsiState());
      else if (code === 1) state.bold = true; else if (code === 2) state.dim = true; else if (code === 3) state.italic = true; else if (code === 4) state.underline = true; else if (code === 7) state.inverse = true;
      else if (code === 22) { state.bold = false; state.dim = false; } else if (code === 23) state.italic = false; else if (code === 24) state.underline = false; else if (code === 27) state.inverse = false;
      else if (code >= 30 && code <= 37) state.fg = normalColors[code - 30]; else if (code === 39) state.fg = null; else if (code >= 40 && code <= 47) state.bg = normalColors[code - 40]; else if (code === 49) state.bg = null;
      else if (code >= 90 && code <= 97) state.fg = brightColors[code - 90]; else if (code >= 100 && code <= 107) state.bg = brightColors[code - 100];
      else if ((code === 38 || code === 48) && codes[i + 1] === 5 && Number.isInteger(codes[i + 2])) { const color = xtermColor(codes[i + 2]); if (code === 38) state.fg = color; else state.bg = color; i += 2; }
      else if ((code === 38 || code === 48) && codes[i + 1] === 2 && codes.slice(i + 2, i + 5).every(Number.isInteger)) { const [r,g,b] = codes.slice(i + 2, i + 5).map(value => Math.max(0, Math.min(255, value))); const color = `rgb(${r} ${g} ${b})`; if (code === 38) state.fg = color; else state.bg = color; i += 4; }
    }
  }
  function stripUnsupportedControls(text) { return text.replace(/\x1b\][\s\S]*?(?:\x07|\x1b\\)/g, '').replace(/\x1b\[[0-?]*[ -/]*[@-~]/g, '').replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/g, ''); }
  function appendStyledText(container, text, state) {
    const cleaned = stripUnsupportedControls(text); if (!cleaned) return;
    const span = document.createElement('span'); span.textContent = cleaned;
    const fg = state.inverse ? state.bg : state.fg; const bg = state.inverse ? state.fg : state.bg;
    if (fg) span.style.color = fg; if (bg) span.style.backgroundColor = bg; if (state.bold) span.style.fontWeight = '700'; if (state.dim) span.style.opacity = '.72'; if (state.italic) span.style.fontStyle = 'italic'; if (state.underline) span.style.textDecoration = 'underline';
    container.appendChild(span);
  }
  function renderAnsi(container, text) {
    container.replaceChildren(); const state = freshAnsiState(); const sgr = /\x1b\[([0-9;]*)m/g; let cursor = 0; let match;
    while ((match = sgr.exec(text)) !== null) { appendStyledText(container, text.slice(cursor, match.index), state); applySgr(state, match[1]); cursor = sgr.lastIndex; }
    appendStyledText(container, text.slice(cursor), state);
  }
  function lineCount(text) { if (!text) return 0; return text.split('\n').length - (text.endsWith('\n') ? 1 : 0); }
  function commandPreview(value) { const first = String(value || '').split('\n').find(line => line.trim()) || 'Command unavailable'; return first.length > 120 ? `${first.slice(0,117)}…` : first; }
  function formatDuration(ms) { if (!Number.isFinite(ms)) return ''; if (ms < 1000) return `${ms} ms`; if (ms < 10000) return `${(ms / 1000).toFixed(2)} s`; return `${(ms / 1000).toFixed(1)} s`; }
  function status(text, className = '') { statusEl.textContent = text; statusEl.className = `status ${className}`.trim(); }

  function outputDetails(label, text, _open, isError) {
    const block = element('div', `block${isError ? ' stderr' : ''}`);
    const lines = lineCount(text); block.appendChild(element('div', 'block-label', `${label}${lines ? ` · ${lines} line${lines === 1 ? '' : 's'}` : ''}`));
    const pre = element('pre', 'output'); renderAnsi(pre, text); block.appendChild(pre); return block;
  }

  const runtimeConfig = __TARGET_OPS_RUNTIME_CONFIG__;
  let collapseTimer = null;
  let sleepTimer = null;
  let sleeping = false;
  function sleepCard() {
    if (execution.open) return;
    viewer.replaceChildren();
    meta.replaceChildren();
    details.hidden = true;
    sleeping = true;
  }
  function scheduleSleepOnly() {
    if (sleepTimer) window.clearTimeout(sleepTimer);
    sleepTimer = window.setTimeout(sleepCard, runtimeConfig.sleepAfterMs);
  }
  function scheduleLifecycle(success) {
    if (collapseTimer) window.clearTimeout(collapseTimer);
    if (sleepTimer) window.clearTimeout(sleepTimer);
    sleeping = false;
    execution.open = true;
    collapseTimer = window.setTimeout(() => { execution.open = false; }, success ? runtimeConfig.successCollapseMs : runtimeConfig.failureCollapseMs);
    sleepTimer = window.setTimeout(sleepCard, runtimeConfig.sleepAfterMs);
  }

  function renderSingle(data, toolInput, fresh = true, summaryOnly = false) {
    const commandText = typeof data.command === 'string' && data.command ? data.command : (typeof toolInput?.command === 'string' ? toolInput.command : 'Command unavailable');
    const target = data.resolved_target?.target || data.target || 'target'; const exitCode = data.exit_code; const timedOut = data.timed_out === true;
    const stdoutText = typeof data.stdout === 'string' ? data.stdout : ''; const stderrText = typeof data.stderr === 'string' ? data.stderr : '';
    title.textContent = 'Command result'; pathEl.textContent = commandPreview(commandText); kindEl.textContent = target;
    if (timedOut) status('Timed out', 'warn'); else if (exitCode === 0) status('Exit 0', 'ok'); else if (typeof exitCode === 'number') status(`Exit ${exitCode}`, 'error'); else status('Finished');
    if (summaryOnly) {
      execution.open = false;
      viewer.replaceChildren();
      meta.replaceChildren();
      details.hidden = true;
      sleeping = true;
      return;
    }
    viewer.replaceChildren();
    const commandBlock = element('div', 'block'); commandBlock.appendChild(element('div', 'block-label', 'Command')); commandBlock.appendChild(element('pre', 'command', commandText)); viewer.appendChild(commandBlock);
    if (stdoutText) viewer.appendChild(outputDetails('stdout', stdoutText, true, false));
    if (stderrText) viewer.appendChild(outputDetails('stderr', stderrText, true, true));
    if (!stdoutText && !stderrText) viewer.appendChild(element('div', 'notice', 'Command completed without output.'));
    meta.innerHTML = metaRow('target', target) + metaRow('exit code', exitCode) + metaRow('timed out', timedOut ? 'yes' : 'no') + metaRow('stdout', data.stdout_truncated ? 'truncated' : 'complete') + metaRow('stderr', data.stderr_truncated ? 'truncated' : 'complete');
    details.hidden = !meta.innerHTML;
    if (fresh) scheduleLifecycle(exitCode === 0 && !timedOut); else scheduleSleepOnly();
  }

  function renderBatchItem(item, fresh = true) {
    const success = item.success === true; const timedOut = item.timed_out === true; const block = element('details', 'batch-item'); block.open = fresh;
    const summary = document.createElement('summary'); summary.appendChild(element('span', 'batch-command', commandPreview(item.command)));
    const parts = []; if (timedOut) parts.push('timed out'); else if (typeof item.exit_code === 'number') parts.push(`exit ${item.exit_code}`); else if (item.error) parts.push('error'); const duration = formatDuration(item.elapsed_ms); if (duration) parts.push(duration);
    summary.appendChild(element('span', `batch-state${!success ? timedOut ? ' warn' : ' error' : ''}`, parts.join(' · ') || (success ? 'done' : 'failed'))); block.appendChild(summary);
    const body = element('div', 'batch-body');
    if (String(item.command || '').includes('\n')) { const commandBlock = element('div', 'block'); commandBlock.appendChild(element('div', 'block-label', 'Command')); commandBlock.appendChild(element('pre', 'command', item.command)); body.appendChild(commandBlock); }
    if (item.cwd) body.appendChild(element('div', 'cwd', `cwd · ${item.cwd}`));
    const stdoutText = typeof item.stdout === 'string' ? item.stdout : ''; const stderrText = typeof item.stderr === 'string' ? item.stderr : '';
    if (stdoutText) body.appendChild(outputDetails('stdout', stdoutText, !success && lineCount(stdoutText) <= 30, false));
    if (stderrText) body.appendChild(outputDetails('stderr', stderrText, !success, true));
    if (!stdoutText && !stderrText && !item.error) body.appendChild(element('div', 'notice', 'Command completed without output.'));
    if (item.error) body.appendChild(element('div', 'notice error', item.error));
    const notes = []; if (item.stdout_truncated) notes.push('stdout truncated'); if (item.stderr_truncated) notes.push('stderr truncated'); if (timedOut) notes.push('timeout exceeded'); if (notes.length) body.appendChild(element('div', 'item-note', notes.join(' · ')));
    block.appendChild(body);
    if (fresh) window.setTimeout(() => { block.open = false; }, success ? runtimeConfig.successCollapseMs : runtimeConfig.failureCollapseMs);
    return block;
  }

  function renderBatch(data, fresh = true, summaryOnly = false) {
    if (fresh && collapseTimer) window.clearTimeout(collapseTimer);
    if (fresh) execution.open = true;
    const results = Array.isArray(data.results) ? data.results : []; const requested = Number.isInteger(data.requested_count) ? data.requested_count : results.length; const executed = Number.isInteger(data.executed_count) ? data.executed_count : results.length; const succeeded = Number.isInteger(data.succeeded) ? data.succeeded : results.filter(item => item.success === true).length; const failed = Number.isInteger(data.failed) ? data.failed : executed - succeeded;
    const target = data.resolved_target?.target || data.target || 'target'; const mode = data.mode === 'parallel' ? 'parallel' : 'sequential';
    title.textContent = `${executed} command${executed === 1 ? '' : 's'}`; pathEl.textContent = `${target} · ${mode}${executed !== requested ? ` · ${executed}/${requested} executed` : ''}`; kindEl.textContent = 'Batch';
    status(failed ? `${succeeded} passed · ${failed} failed` : `${succeeded} passed`, failed ? 'error' : 'ok');
    if (summaryOnly) {
      execution.open = false;
      viewer.replaceChildren();
      meta.replaceChildren();
      details.hidden = true;
      sleeping = true;
      return;
    }
    viewer.replaceChildren(); if (!results.length) viewer.appendChild(element('div', 'notice', 'No command results returned.')); else results.forEach(item => viewer.appendChild(renderBatchItem(item, fresh)));
    meta.innerHTML = metaRow('target', target) + metaRow('mode', mode) + metaRow('requested', requested) + metaRow('executed', executed) + metaRow('succeeded', succeeded) + metaRow('failed', failed) + metaRow('timed out', data.timed_out) + metaRow('stopped early', data.stopped_early ? 'yes' : 'no');
    details.hidden = !meta.innerHTML;
    if (fresh) scheduleLifecycle(failed === 0 && !data.timed_out); else scheduleSleepOnly();
  }

  function render(raw, toolInput, fresh = true, summaryOnly = false) { const data = raw && typeof raw === 'object' ? raw : {}; if (Array.isArray(data.results) && ('requested_count' in data || 'executed_count' in data)) renderBatch(data, fresh, summaryOnly); else renderSingle(data, toolInput, fresh, summaryOnly); }

  let rpcId = 0; const pendingRequests = new Map();
  // COMPAT(COMPAT-003): Normalize older window.openai bootstrap/input shapes
  // alongside the current MCP Apps notification envelope.
  let currentToolInput = window.openai?.toolInput || null;
  let resultId = null;
  let legacyInitialHydrated = false;
  let historicalFallback = null;
  let suppressHistoricalReplayWithoutId = false;
  const historicalResultIds = new Set();
  let bridgeReady = false;
  let sizeReportScheduled = false;
  let lastReportedWidth = 0;
  let lastReportedHeight = 0;
  let resizeObserver = null;
  let liveStdout = ''; let liveStderr = ''; let stdoutSeq = 0; let stderrSeq = 0; let jobPolling = false;
  const rpcRequest = (method, params) => new Promise((resolve, reject) => { const id = ++rpcId; pendingRequests.set(id, {resolve,reject}); window.parent.postMessage({jsonrpc:'2.0',id,method,params}, '*'); });
  // COMPAT(COMPAT-003): Normalize historical tools/call result envelopes used by
  // older ChatGPT hosts in addition to structuredContent.
  const toolResultData = result => result?.structuredContent || result?.content?.find?.(item => item?.type === 'json')?.json || result?.content || result || {};

  function scheduleSizeReport() {
    if (!bridgeReady || sizeReportScheduled) return;
    sizeReportScheduled = true;
    window.requestAnimationFrame(() => {
      sizeReportScheduled = false;
      const root = document.documentElement;
      const originalHeight = root.style.height;
      root.style.height = 'max-content';
      const height = Math.ceil(root.getBoundingClientRect().height);
      root.style.height = originalHeight;
      const width = Math.ceil(window.innerWidth);
      if (width <= 0 || height <= 0) return;
      if (width === lastReportedWidth && height === lastReportedHeight) return;
      lastReportedWidth = width;
      lastReportedHeight = height;
      window.parent.postMessage({ jsonrpc: '2.0', method: 'ui/notifications/size-changed', params: { width, height } }, '*');
    });
  }
  function startAutoResize() {
    bridgeReady = true;
    scheduleSizeReport();
    if (typeof ResizeObserver === 'function') {
      resizeObserver = new ResizeObserver(scheduleSizeReport);
      resizeObserver.observe(document.documentElement);
      resizeObserver.observe(document.body);
    }
    window.addEventListener('resize', scheduleSizeReport);
  }

  // COMPAT(COMPAT-003): Saved ChatGPT cards may bootstrap through window.openai
  // and then replay the same result after the MCP Apps handshake. Render only a
  // compact summary before the handshake and never rearm fresh-result expansion
  // for a replayed historical result.
  function hydrateLegacyInitialResult() {
    if (legacyInitialHydrated) return true;
    const raw = window.openai?.toolOutput
      || window.openai?.toolResponseMetadata?.mcp_tool_result
      || window.openai?.toolResponseMetadata?.call_tool_result
      || window.openai?.toolResponseMetadata?.structuredContent;
    if (!raw) return false;
    legacyInitialHydrated = true;
    const data = toolResultData(raw);
    if (typeof data?.result_id === 'string') historicalResultIds.add(data.result_id);
    else { historicalFallback = raw; suppressHistoricalReplayWithoutId = true; }
    handleResult(raw, false, true);
    return true;
  }
  function isFreshResultNotification(raw) {
    const data = toolResultData(raw);
    if (typeof data?.result_id === 'string' && historicalResultIds.has(data.result_id)) return false;
    if (!data?.result_id && suppressHistoricalReplayWithoutId) {
      suppressHistoricalReplayWithoutId = false;
      return false;
    }
    return true;
  }

  function renderLive(data, toolInput, fresh = true, summaryOnly = false) {
    if (collapseTimer) window.clearTimeout(collapseTimer);
    if (sleepTimer) window.clearTimeout(sleepTimer);
    sleeping = false;
    if (fresh) execution.open = true;
    const commandText = typeof toolInput?.command === 'string' ? toolInput.command : 'Command unavailable';
    const target = data.target || toolInput?.target || 'target';
    title.textContent = 'Command result'; pathEl.textContent = commandPreview(commandText); kindEl.textContent = target;
    const state = data.status || 'running';
    if (state === 'running') status('Running'); else if (state === 'timed_out') status('Timed out', 'warn'); else if (state === 'completed') status(typeof data.exit_code === 'number' ? `Exit ${data.exit_code}` : 'Completed', 'ok'); else if (state === 'failed') status(typeof data.exit_code === 'number' ? `Exit ${data.exit_code}` : 'Failed', 'error'); else status(state);
    if (summaryOnly) {
      execution.open = false;
      viewer.replaceChildren();
      meta.replaceChildren();
      details.hidden = true;
      sleeping = true;
      return;
    }
    viewer.replaceChildren();
    const commandBlock = element('div', 'block'); commandBlock.appendChild(element('div', 'block-label', 'Command')); commandBlock.appendChild(element('pre', 'command', commandText)); viewer.appendChild(commandBlock);
    if (liveStdout) viewer.appendChild(outputDetails('stdout', liveStdout, true, false));
    if (liveStderr) viewer.appendChild(outputDetails('stderr', liveStderr, true, true));
    if (!liveStdout && !liveStderr) viewer.appendChild(element('div', 'notice', state === 'running' ? 'Running…' : 'Command completed without output.'));
    meta.innerHTML = metaRow('target', target) + metaRow('elapsed', formatDuration(data.elapsed_ms)) + metaRow('exit code', data.exit_code);
    details.hidden = !meta.innerHTML;
    viewer.scrollTop = viewer.scrollHeight;
  }

  async function pollJob(startData, reset = true, fresh = true) {
    if (jobPolling || !startData?.job_id) return;
    jobPolling = true;
    if (reset) { liveStdout = ''; liveStderr = ''; stdoutSeq = 0; stderrSeq = 0; }
    try {
      while (true) {
        const response = await rpcRequest('tools/call', { name: 'job_output', arguments: { job_id: startData.job_id, stdout_since_seq: stdoutSeq, stderr_since_seq: stderrSeq } });
        if (response?.isError) throw new Error('job_output failed');
        const result = toolResultData(response);
        if (typeof result.stdout === 'string') liveStdout += result.stdout;
        if (typeof result.stderr === 'string') liveStderr += result.stderr;
        if (Number.isInteger(result.stdout_next_seq)) stdoutSeq = result.stdout_next_seq;
        if (Number.isInteger(result.stderr_next_seq)) stderrSeq = result.stderr_next_seq;
        renderLive(result, currentToolInput, fresh);
        if (result.eof) { if (fresh) scheduleLifecycle(result.status === 'completed' && result.exit_code === 0 && !result.timed_out); else scheduleSleepOnly(); break; }
        await new Promise(resolve => setTimeout(resolve, runtimeConfig.jobPollIntervalMs));
      }
    } catch (_) {
      status('Output unavailable', 'warn');
      if (fresh) scheduleLifecycle(false); else scheduleSleepOnly();
    } finally { jobPolling = false; }
  }

  function handleResult(raw, fresh = true, summaryOnly = false) {
    const data = toolResultData(raw);
    if (typeof data?.result_id === 'string') resultId = data.result_id;
    if (data?.job_id && data?.status === 'running') {
      if (summaryOnly) renderLive(data, currentToolInput, false, true);
      else pollJob(data, true, fresh);
    } else render(data, currentToolInput, fresh, summaryOnly);
  }

  async function restoreSleepingCard() {
    if (!sleeping) return;
    sleeping = false;
    if (historicalFallback) {
      handleResult(historicalFallback, false, false);
      return;
    }
    if (!resultId) { viewer.innerHTML = '<div class="notice">Result unavailable.</div>'; return; }
    viewer.innerHTML = '<div class="notice">Loading result…</div>';
    try {
      const cached = toolResultData(await rpcRequest('tools/call', { name: 'result_read', arguments: { result_id: resultId } }));
      if (!cached?.found || !cached?.data) { viewer.innerHTML = '<div class="notice">Result expired.</div>'; return; }
      if (cached.data.job_id) await pollJob(cached.data, true, false); else render(cached.data, currentToolInput, false);
    } catch (_) { viewer.innerHTML = '<div class="notice">Result unavailable.</div>'; }
  }

  execution.addEventListener('toggle', () => {
    if (execution.open) {
      if (sleepTimer) window.clearTimeout(sleepTimer);
      if (sleeping) restoreSleepingCard();
    } else scheduleSleepOnly();
  });
  // COMPAT(COMPAT-003): Accept both current structuredContent notifications and
  // older toolInput/arguments/content/plain-param host envelopes.
  window.addEventListener('message', event => {
    const msg = event.data;
    if (msg?.jsonrpc === '2.0' && msg.id !== undefined && pendingRequests.has(msg.id)) { const pending = pendingRequests.get(msg.id); pendingRequests.delete(msg.id); if (msg.error) pending.reject(msg.error); else pending.resolve(msg.result); return; }
    if (msg?.method === 'ui/notifications/tool-input') { currentToolInput = msg.params?.arguments || msg.params?.toolInput || msg.params; return; }
    if (msg?.method === 'ui/notifications/tool-result') {
      currentToolInput = msg.params?.toolInput || msg.params?.arguments || currentToolInput;
      const raw = msg.params?.structuredContent || msg.params?.content || msg.params;
      const fresh = isFreshResultNotification(raw);
      if (fresh) handleResult(raw, true, false);
      else if (sleeping) handleResult(raw, false, true);
    }
  });
  async function initializeBridge() {
    await rpcRequest('ui/initialize', { appInfo: { name: 'target-ops-exec-result', version: '1.5.0' }, appCapabilities: { tools: {} }, protocolVersion: '2026-01-26' });
    window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}}, '*');
    hydrateLegacyInitialResult();
    startAutoResize();
  }
  hydrateLegacyInitialResult();
  initializeBridge().catch(error => console.error('Failed to initialize MCP Apps bridge:', error));
})();
</script>
