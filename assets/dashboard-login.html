<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <title>登录 · Target Ops</title>
  <style>@@AUTH_STYLES@@
    #page-title { margin-bottom: 22px; }
  </style>
</head>
<body>
<main class="shell">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3m-9 0h8a2 2 0 0 1 2 2v7H6v-7a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Target Ops
  </div>
  <section class="card" aria-labelledby="page-title">
    <div class="content">
      <h1 id="page-title">调用记录</h1>
      @@ERROR_BLOCK@@
      <form action="/dashboard/login" method="post">
        <label for="password">密码</label>
        <div class="password-field">
          <input id="password" name="password" type="password" autocomplete="current-password"
            aria-invalid="@@ARIA_INVALID@@" required autofocus spellcheck="false">
          <button class="toggle-password" type="button" aria-label="显示密码" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="2.8" stroke="currentColor" stroke-width="1.7"/></svg>
          </button>
        </div>
        <div class="form-actions"><button class="authorize" type="submit">登录</button></div>
      </form>
    </div>
  </section>
</main>
<script>
(() => {
  const input = document.getElementById('password');
  const toggle = document.querySelector('.toggle-password');
  if (!input || !toggle) return;
  toggle.addEventListener('click', () => {
    const reveal = input.type === 'password';
    input.type = reveal ? 'text' : 'password';
    toggle.setAttribute('aria-pressed', String(reveal));
    toggle.setAttribute('aria-label', reveal ? '隐藏密码' : '显示密码');
    input.focus({preventScroll:true});
  });
})();
</script>
</body>
</html>
