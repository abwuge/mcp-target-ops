[package]
name = "mcp-target-ops"
version = "0.1.0"
edition = "2021"
description = "Policy-gated MCP server for local and SSH operations"
license = "MIT"
repository = "https://github.com/abwuge/mcp-target-ops"
readme = "README.md"

[dependencies]
base64 = "0.22"
diffy = "0.4"
libc = "0.2"
portable-pty = "0.9"
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tempfile = "3"
thiserror = "2"
tiny_http = "0.12"
toml = "0.8"

[build-dependencies]
winresource = "0.1"
