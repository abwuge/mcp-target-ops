# Target Ops merges newly introduced built-in defaults into this document at
# startup. Existing values and comments are preserved. Disable disk rewriting
# while still using in-memory defaults with rewrite_on_start = false.
[config]
rewrite_on_start = true

[runtime]
result_cache_max_bytes = 104857600
max_retained_jobs = 128
max_retained_foreground_execs = 64
exec_auto_background_after_ms = 5000
stream_default_max_bytes = 65536
stream_max_bytes = 524288
job_wait_default_timeout_ms = 60000
job_wait_max_timeout_ms = 120000
file_transfer_default_max_bytes = 26214400
file_download_timeout_ms = 30000
terminal_default_rows = 30
terminal_default_cols = 120
app_success_collapse_ms = 3000
app_failure_collapse_ms = 6000
app_sleep_after_ms = 30000
app_job_poll_interval_ms = 180

[server]
name = "mcp-target-ops"
# Fallback used only when a call has no explicit target and no target was selected
# with target_select. It is not treated as the active target.
default_target = "ssh:dev"
terminal_ring_buffer_bytes = 524288
runtime_dir = "/tmp/mcp-target-ops"
# Optional static HTTP bearer authentication. Prefer MCP_TARGET_OPS_HTTP_TOKEN
# instead of storing the token here. This is the simplest mode for a private
# GPT Action or another single-service client.
# http_bearer_token = "change-me"
#
# Exact public HTTPS origin used by OAuth metadata, the generated GPT Actions
# OpenAPI document, and the ChatGPT MCP App widget domain. Do not include a
# trailing slash. You may also use MCP_TARGET_OPS_PUBLIC_BASE_URL.
# public_base_url = "https://mcp.example.com"
#
# Optional OAuth support for remote HTTP MCP / ChatGPT Apps.
# oauth_enabled = true
# oauth_scopes = ["mcp:tools"]
# oauth_authorization_password = "change-me"
# oauth_allow_dynamic_client_registration = true
# oauth_authorization_code_ttl_secs = 600
# oauth_access_token_ttl_secs = 3600
# oauth_refresh_token_ttl_secs = 2592000
# OAuth clients and tokens persist across restarts. Defaults to the path below;
# MCP_TARGET_OPS_OAUTH_STATE_FILE can override it. On Unix the file must be 0600.
# oauth_state_file = "/home/me/.config/mcp-target-ops/oauth-state.json"

# Optional downstream Streamable HTTP MCP server. Prefer a dedicated mode-0600
# config file owned by Target Ops. Its format is:
#   url = "https://memory.example.com/mcp"
#   [headers]
#   Authorization = "Bearer replace-me"
#
# [mcp_servers.memory]
# enabled = true
# config_file = "/home/me/.config/mcp-target-ops/mcp/memory.toml"
# timeout_ms = 20000
# max_response_bytes = 1048576
#
# Advanced alternative: keep an endpoint or headers in another file-backed
# secret source. Exactly one of config_file, url, or url_secret is required.
# [mcp_servers.other]
# enabled = true
# secret_target = "local"
# url_secret = { path = "/home/me/secrets.toml", format = "toml", key = "mcp.url" }
# [mcp_servers.other.secret_headers]
# Authorization = { path = "/home/me/secrets.toml", format = "toml", key = "mcp.Authorization" }

# "local" is the reserved key for the single local target. Local access is
# intentionally disabled by default; enable it only for trusted setups.
[targets.local]
kind = "local"
enabled = false
shell = "bash"

[targets.local.policy]
allow_exec = false
allow_terminal = false
allow_file_read = false
allow_file_write = false
allow_select_active = false
require_explicit_target_for_write = true
allowed_roots = ["/tmp"]
default_timeout_ms = 30000
max_output_bytes = 200000

# Every non-local target must use kind = "ssh". This section is exposed as the
# external target id "ssh:dev".
[targets.dev]
kind = "ssh"
enabled = true
host = "dev.example.com"
port = 22
user = "ubuntu"
# identity_file = "/Users/you/.ssh/id_ed25519"
extra_args = ["-o", "BatchMode=yes"]
shell = "bash"

[targets.dev.policy]
allow_exec = true
allow_terminal = true
allow_file_read = true
allow_file_write = true
allow_select_active = true
require_explicit_target_for_write = true
allowed_roots = ["/home/ubuntu/app", "/tmp"]
default_timeout_ms = 30000
max_output_bytes = 200000

# Example prod target with safer defaults.
[targets.prod]
kind = "ssh"
enabled = true
host = "prod.example.com"
port = 22
user = "ubuntu"
extra_args = ["-o", "BatchMode=yes"]

[targets.prod.policy]
allow_exec = true
allow_terminal = false
allow_file_read = true
allow_file_write = false
allow_select_active = false
require_explicit_target_for_write = true
allowed_roots = ["/srv/app", "/var/log"]
default_timeout_ms = 30000
max_output_bytes = 200000
